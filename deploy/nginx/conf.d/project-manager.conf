# Project Manager 生产站点反向代理（NGINX 安装在宿主机）。
# 将所有 project-manager.example.com 替换为实际域名，并准备对应证书。
# SERVER_PORT 修改后，需同步修改下方 upstream 的宿主机端口。
upstream project_manager_app {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name project-manager.example.com;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    # 可选的 ACME HTTP-01 验证目录。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        # 308 保留 POST 等请求的方法和请求体。
        return 308 https://project-manager.example.com$request_uri;
    }
}

server {
    # 兼容 NGINX 1.24；1.25.1+ 也可改为 listen 443 ssl; 配合 http2 on;。
    listen 443 ssl http2;
    server_name project-manager.example.com;

    ssl_certificate /etc/nginx/certs/project-manager.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/project-manager.example.com/privkey.pem;
    ssl_session_cache shared:PM_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 使用内置日志格式，可直接加入已有 NGINX，无需自定义 map 或 snippets。
    access_log /var/log/nginx/project-manager.access.log combined;
    error_log /var/log/nginx/project-manager.error.log warn;

    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 60s;
    send_timeout 300s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 所有 proxy location 继承此处的完整请求头设置。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Next.js App Router 的流式渲染需要关闭响应缓冲。
    # 缓存策略由 Next.js 的 Cache-Control / Vary 响应头决定。
    proxy_buffering off;
    proxy_cache off;

    # 此接口仅检查 NGINX 存活，不代表应用或数据库健康。
    location = /nginx-health {
        access_log off;
        return 204;
    }

    # 静态文件由当前运行的 Next.js 版本提供，兼容应用内自更新。
    # 保留 Next.js 自带的 immutable 缓存头，避免重复或缓存错误响应。
    location ^~ /_next/static/ {
        proxy_pass http://project_manager_app;
        proxy_buffering on;
    }

    # 多服务器按顺序同步，整体执行时间可能超过单台的 120 秒限制。
    location = /api/sync {
        proxy_pass http://project_manager_app;
        proxy_read_timeout 1800s;
    }

    # 自更新含下载、解压和原生模块重编译，备份含 WebDAV 上传与清理。
    location = /api/version/update {
        proxy_pass http://project_manager_app;
        proxy_read_timeout 1800s;
    }

    location = /api/backup/run {
        proxy_pass http://project_manager_app;
        proxy_read_timeout 1800s;
    }

    # 页面、登录、API、图片优化与 RSC 请求均保持原始路径和查询参数。
    location / {
        proxy_pass http://project_manager_app;
    }
}
